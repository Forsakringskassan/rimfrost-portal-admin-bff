# Port — different from portal-bff (9001) to allow running both locally
quarkus.http.port=9091

# OUL backend URLs
quarkus.rest-client.oul.url=${BE_OUL_URL:http://localhost:8889}
quarkus.rest-client.oul-management.url=${BE_OUL_MANAGEMENT_URL:http://localhost:8890}

# CORS — allow admin frontend on 3031
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3035
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Use mock OUL data until a real admin endpoint exists in OUL
portal.admin.mock.uppgifter=true

# Container image
quarkus.container-image.build=true
quarkus.container-image.name=rimfrost-portal-admin-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false
